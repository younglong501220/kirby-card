name: Deploy to GitHub Pages

on:
  push:
    branches:
      - main
      - master
  workflow_dispatch:

# Sets permissions of the GITHUB_TOKEN to allow deployment to GitHub Pages
permissions:
  contents: read
  pages: write
  id-token: write

# Allow only one concurrent deployment
concurrency:
  group: 'pages'
  cancel-in-progress: false

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Cache npm packages
        id: npm-cache
        uses: actions/cache@v4
        with:
          path: ~/.npm
          key: ${{ runner.os }}-node22-${{ hashFiles('**/package.json') }}
          restore-keys: |
            ${{ runner.os }}-node22-

      - name: Check Cache Status
        run: |
          echo "Cache hit status: ${{ steps.npm-cache.outputs.cache-hit || 'miss' }}"

      - name: Install dependencies
        # 使用 --legacy-peer-deps 徹底避免套件版本衝突失敗
        run: npm install --legacy-peer-deps

      - name: Code quality check (Lint)
        run: npm run lint

      - name: Run test validation
        run: npm run test

      - name: Build static distribution
        run: npm run build

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist/

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build-and-test
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
